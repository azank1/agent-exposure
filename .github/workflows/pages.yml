name: pages
# Publishes site/ (the in-browser Supabase migration check) with the checker code from the same commit.
on:
  push:
    branches: [main]
    paths: ["site/**", "repo_check.py", "agent_exposure.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the site
        run: |
          mkdir _site
          cp site/index.html repo_check.py agent_exposure.py docs/assets/social-preview.png _site/
          git describe --tags --match 'v*.*.*' > _site/version.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
